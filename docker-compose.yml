services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pcbuilder-sqlserver
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-YourStrong!Passw0rd}"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${SA_PASSWORD:-YourStrong!Passw0rd}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  rabbitmq:
    image: rabbitmq:4-management
    container_name: pcbuilder-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: pcbuilder-azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    volumes:
      - azurite_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({host:'127.0.0.1',port:10000,path:'/'}, (r) => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: PcBuilder.Api/Dockerfile
    container_name: pcbuilder-api
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=PcBuilder;User Id=sa;Password=${SA_PASSWORD:-YourStrong!Passw0rd};TrustServerCertificate=True"
      RabbitMq__HostName: rabbitmq
      Jwt__Secret: "${JWT_SECRET:-super-secret-key-for-development-only-change-in-prod}"
      AzureTranslator__Key: "${AZURE_TRANSLATOR_KEY:-}"
      AzureTranslator__Region: "${AZURE_TRANSLATOR_REGION:-}"
      Cors__AllowedOrigins__0: "http://localhost:5173"
      Cors__AllowedOrigins__1: "http://localhost:8080"
      AzureStorage__ConnectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UGW0s/Y9rSKRCjteAWISd/zFoE96vsAIZNgLQ==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      AzureStorage__ContainerName: "component-images"
      TextModeration__BaseUrl: "http://moderation:8001"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      azurite:
        condition: service_healthy

  scraper-worker:
    build:
      context: ./backend
      dockerfile: PcBuilder.ScraperWorker/Dockerfile
    container_name: pcbuilder-scraper-worker
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=PcBuilder;User Id=sa;Password=${SA_PASSWORD:-YourStrong!Passw0rd};TrustServerCertificate=True"
      RabbitMq__HostName: rabbitmq
      AzureTranslator__Key: "${AZURE_TRANSLATOR_KEY:-}"
      AzureTranslator__Region: "${AZURE_TRANSLATOR_REGION:-}"
      AzureStorage__ConnectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UGW0s/Y9rSKRCjteAWISd/zFoE96vsAIZNgLQ==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      AzureStorage__ContainerName: "component-images"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      azurite:
        condition: service_healthy

  moderation:
    build:
      context: ./TextModerationApi
      dockerfile: Dockerfile
    container_name: pcbuilder-moderation
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: "${VITE_GOOGLE_CLIENT_ID:-}"
    container_name: pcbuilder-frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  sqlserver_data:
  rabbitmq_data:
  azurite_data:
