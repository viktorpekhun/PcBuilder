name: Deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write   # required for azure/login OIDC
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # 1. Build & push 3 images to Azure Container Registry
  # ─────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & push ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            context: ./backend
            dockerfile: ./backend/PcBuilder.Api/Dockerfile
            build_args: ""
          - name: scraper
            context: ./backend
            dockerfile: ./backend/PcBuilder.ScraperWorker/Dockerfile
            build_args: ""
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            build_args: |
              VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.name }}:${{ env.IMAGE_TAG }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.name }}:latest
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  # ─────────────────────────────────────────────────────────────────────
  # 2. Apply EF Core migrations to Azure SQL
  # ─────────────────────────────────────────────────────────────────────
  migrate-db:
    name: Apply EF migrations
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 9.*

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get runner public IP
        id: ip
        run: echo "ip=$(curl -fsSL https://api.ipify.org)" >> "$GITHUB_OUTPUT"

      - name: Allow runner IP through Azure SQL firewall
        run: |
          az sql server firewall-rule create \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --server ${{ secrets.SQL_SERVER_NAME }} \
            --name "gha-runner-${{ github.run_id }}" \
            --start-ip-address ${{ steps.ip.outputs.ip }} \
            --end-ip-address ${{ steps.ip.outputs.ip }}

      - name: Apply migrations
        run: |
          dotnet ef database update \
            --project backend/PcBuilder.Persistence \
            --startup-project backend/PcBuilder.Api \
            --connection "${{ secrets.SQL_CONNECTION_STRING }}"

      - name: Remove runner IP from firewall
        if: always()
        run: |
          az sql server firewall-rule delete \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --server ${{ secrets.SQL_SERVER_NAME }} \
            --name "gha-runner-${{ github.run_id }}" \
            || true

  # ─────────────────────────────────────────────────────────────────────
  # 3. Roll out new image tag to each Container App
  # ─────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: migrate-db
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ca-api
            image: api
          - service: ca-scraper
            image: scraper
          - service: ca-frontend
            image: frontend
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update ${{ matrix.service }} to ${{ env.IMAGE_TAG }}
        run: |
          az containerapp update \
            --name ${{ matrix.service }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
